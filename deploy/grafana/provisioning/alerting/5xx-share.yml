apiVersion: 1

groups:
  - orgId: 1
    name: equipment-api
    folder: Alerts
    interval: 1m
    rules:
      - uid: api-5xx-share
        title: Доля 5xx выше 5%
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: Доля ответов 5xx превышает 5% за последние 5 минут
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: sum(rate(http_requests_total{status_code=~"5.."}[5m])) / sum(rate(http_requests_total[5m])) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.05
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: C
              type: threshold
