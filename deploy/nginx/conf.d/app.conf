# Обратный прокси: наружу смотрит только nginx, приложение живёт без публикации портов.
upstream app_api {
    server app:3000;
}

server {
    listen 80;
    listen 443;
    server_name _;

    # API целиком за префиксом /api — его и проксируем
    location /api/ {
        proxy_pass http://app_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # таймауты: соединение 5 с, чтение и отправка 30 с
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Проверка самого прокси: работает, даже когда приложение ещё не поднялось
    location = /health {
        return 200 'ok';
    }

    location / {
        return 404;
    }
}
